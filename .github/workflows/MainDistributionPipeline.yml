#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # `push` IS RESTRICTED TO main. Unrestricted, a branch push and that branch's
  # `pull_request` event both fire on the same commit, so every PR commit was built
  # TWICE -- two full matrices competing for the same runners. A branch with no PR now
  # gets no run, which is the intended trade: open the PR and it is built once.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# github.event_name IS PART OF THE KEY, and leaving it out is why this repo kept
# reporting red on green commits. `push` and `workflow_dispatch` on the same ref share
# a ref and a sha, so with cancel-in-progress they shared a group and each cancelled
# the other -- and GitHub reports a CANCELLED job on a commit as a FAILURE. Both merge
# runs for PRs #12 and #13 died this way, leaving main's tip with no completed run at
# all while every local gate was green.
#
# Diagnosed in webbed from the identical symptom, and confirmed in duck_block_utils,
# where adding this one component let a dispatch and a push run for the same sha
# complete side by side, both green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Forward-compat canary: intentionally builds against duckdb `main`, which is the
  # v2.0 line. duckdb/community-extensions builds every release PR against v2.0 via
  # build_next.yml and there is no per-extension opt-out, so a source break there is a
  # red check on every release. This job finds it here first.
  #
  # Advisory, NOT a merge blocker -- merge-readiness is judged on the stable build
  # below. Restricted to workflow_dispatch and pushes to main on purpose: `push` and
  # `pull_request` both fire on the same commit and a PR's check rollup includes both,
  # so an unrestricted canary would show red on every PR. And it must be `if:` rather
  # than `continue-on-error:` -- a job that calls a REUSABLE workflow accepts only a
  # fixed set of keys, and `continue-on-error` makes the whole file fail to parse,
  # scheduling zero jobs rather than one advisory one.
  # THE NEXT LINE, first-class. duckdb/community-extensions builds every descriptor
  # that carries ref_next against `v2.0-cyanoptera` (build_next.yml), so a PR is not
  # green here until it builds and tests there too. This was the canary until
  # 2026-09-13; Teague's dual-line ruling removed its gate.
  #
  # MATRIX WIDTH: the reusable workflow's reduced_ci_mode defaults to `auto`, which
  # builds three arches on pull requests (linux_amd64, windows_amd64, wasm_eh) and
  # the full matrix on pushes to main and on dispatch (markdown, measured
  # 2026-09-13). Kept on purpose: releases are cut from main after the push run, so
  # an arm64/macOS 2.0 break still surfaces before any descriptor PR. To build the
  # full matrix on PRs too, add `reduced_ci_mode: disabled` below; exclude_archs
  # can only narrow a matrix, never widen one.
  #
  # ONCE PER PR, ONCE PER MERGE. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so an ungated job here builds twice per
  # push (markdown, measured on 126739d). This gate runs it on every pull request,
  # on merges to main, and on dispatch; the one case it does not cover is a branch
  # with no PR open, which gets its first next-line build when the PR opens.
  #
  # PANDUCK'S HISTORY WITH THIS LINE, kept because it is why the line is first-class here:
  # this job used to build DuckDB `main`, and on 5a0331b it went green on every platform
  # while the registry's test_against_latest rejected that exact commit -- `main` still
  # pulled in duckdb/catalog/catalog.hpp transitively and v2.0-cyanoptera did not. It was
  # retargeted to the tag, then ungated on PRs (Teague, 2026-09-13, adopting the fleet
  # reference). panduck's `on: push` is already restricted to main, so the double build the
  # gate below prevents cannot occur here; the gate is copied verbatim anyway so every repo
  # carries the same line.
  duckdb-next-build:
    name: Build extension binaries (duckdb next, v2.0 line)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: panduck

  # ADVISORY canary on DuckDB main, the line beyond 2.0. Pushes to main and on
  # demand only: a push and a pull_request both fire on the same commit and a PR's
  # rollup includes both, so an unconditional job here would redden every PR for a
  # line nobody ships. `if:` rather than `continue-on-error:` because a job calling
  # a REUSABLE workflow accepts only a fixed set of keys.
  #   gh workflow run MainDistributionPipeline.yml --ref <branch>
  duckdb-main-canary:
    name: Build extension binaries (duckdb main canary)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: panduck

  # THREE ENCODINGS OF ONE FACT, asserted equal instead of maintained in parallel: the
  # duckdb submodule pin, the duckdb_version lines this workflow's build jobs ship, and the
  # lines the community registry builds. When they drift, the local build and the served
  # artifact are different software and nothing says so.
  #
  # Copied verbatim from duck_block_utils main at 82241ea (their PR #33, squash-merged; the
  # reviewed branch head was cf408b5, which is NOT in main's history, so compare against
  # 82241ea), so every repo in the fleet asserts the same rule the same way. The only
  # repo-specific line is `wf=`, this file's own name, which matches theirs. Its degraded
  # paths (unreachable is a NOTE; a non-200 fetch or an unparseable registry file is a
  # FAILURE) are documented inline in the run block below and deliberately NOT restated
  # here, so there is one description of them rather than two that can drift apart.
  #
  # THE AUTHORITY IS THE REGISTRY, not this job's constants: on 2026-09-13 panduck's
  # canary built DuckDB `main`, went green on 5a0331b, and the registry rejected that exact
  # commit for a v2.0-cyanoptera compile error.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    # Name kept as-is even though the rule is now "pin equals the registry default":
    # required-check configuration may key on this job name.
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v1.5.5
      DUCKDB_NEXT: v2.0-cyanoptera
      # Flip day (spec §3 step 3) keeps a duckdb-legacy-build at the outgoing version
      # for one release; set this to that version then so the stray-literal scan below
      # exempts it instead of flagging it. Empty the rest of the time.
      DUCKDB_LEGACY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Compare the submodule pin with the tag's commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # One variable, one edit point: every sibling repo copies this job
          # verbatim, and the greps and the stray-literal scan below all read
          # this same file.
          wf=.github/workflows/MainDistributionPipeline.yml
          want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}^{}" | cut -f1)
          [ -n "$want" ] || want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}" | cut -f1)
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "shipped tag ${DUCKDB_VERSION} -> ${want}"
          echo "submodule pin          -> ${have}"
          [ -n "$want" ] || { echo "::error::could not resolve tag ${DUCKDB_VERSION} upstream"; exit 1; }
          [ "$want" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the ${DUCKDB_VERSION} tag ${want}; run: git -C duckdb fetch --tags && git -C duckdb checkout ${DUCKDB_VERSION}"; exit 1; }
          n=$(grep -c "duckdb_version: ${DUCKDB_VERSION}$" "$wf" || true)
          [ "$n" -ge 1 ] || { echo "::error::no build job in this workflow ships duckdb_version: ${DUCKDB_VERSION}; this job's constant has drifted"; exit 1; }
          m=$(grep -c "duckdb_version: ${DUCKDB_NEXT}$" "$wf" || true)
          [ "$m" -ge 1 ] || { echo "::error::no build job in this workflow builds the next line duckdb_version: ${DUCKDB_NEXT}"; exit 1; }
          # NO OTHER DuckDB PATCH VERSION may drift from the shipped ${DUCKDB_VERSION}
          # anywhere else in this file: sibling workflows (yaml, mcp) embed a version
          # in artifact NAMES and CLI download URLs (e.g. `yaml-v1.5.4-extension-wasm_*`,
          # `releases/download/v1.5.4/duckdb_cli`) that the `duckdb_version:` greps above
          # cannot see, so a bump left them stale and this job went green over a red
          # build. Comment lines (first non-space char `#`) are exempt, and so are
          # `uses:` lines (a `- uses:` list item too): a third-party action pin like
          # `@v2.0.4` is not a DuckDB version. Branch/tag names like `v2.0-cyanoptera`
          # and `v1.5-variegata` have no third numeric component and so never match
          # this pattern. DUCKDB_LEGACY, when set (flip day, see above), is exempt too.
          bad=0
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            for v in $(printf '%s\n' "$line" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true); do
              if [ "$v" != "$DUCKDB_VERSION" ]; then
                if [ -n "$DUCKDB_LEGACY" ] && [ "$v" = "$DUCKDB_LEGACY" ]; then
                  continue
                fi
                echo "::error::line ${lineno}: ${line} -- a DuckDB version literal that is not the shipped ${DUCKDB_VERSION}: derive it from the shipped version or bump it"
                bad=1
              fi
            done
          done < <(grep -nE 'v[0-9]+\.[0-9]+\.[0-9]+' "$wf" || true)
          [ "$bad" -eq 0 ] || exit 1
          # THE AUTHORITY is the registry's own files, not this job's constants: a
          # constant checked only against itself passes for a year after the registry
          # moves (panduck, 2026-09-13). Resolve main to a sha first so the raw fetches
          # are not served from the branch cache. THREE degraded paths, deliberately
          # different: UNREACHABLE (curl itself failed, HTTP code 000) is the world
          # being unavailable -> a NOTE, and the summary says the registry assertions
          # were not made, with only the local-constant assertions above run; a
          # non-2xx HTTP code (e.g. a renamed/removed registry file) is this check
          # asking the world a well-formed question and getting told no -> a FAILURE
          # naming the code and URL (a bare `curl -sf` would have mistaken this for
          # UNREACHABLE and measured nothing); REACHABLE, 2xx, BUT UNPARSEABLE is this
          # check being wrong about the file's content -> also a FAILURE.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          base="https://raw.githubusercontent.com/duckdb/community-extensions"
          # An Authorization: Bearer header with an EMPTY token is not "no header": GitHub
          # answers 401 to it, worse than sending no header at all (confirmed empirically).
          # An unauthenticated local run (no GITHUB_TOKEN, which the docs tell maintainers
          # to run) would then always miss sha resolution and fall back to the `main` REF
          # NAME, comparing against whatever the branch URL's cache happens to be serving --
          # the exact staleness this sha-resolution step exists to avoid. So the header is
          # added only when a token is actually present; CI always has one.
          auth=(); [ -n "${GITHUB_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          sha=$(curl -sf "${auth[@]}" https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          f1=$(mktemp); f2=$(mktemp)
          # curl itself writes 000 to -w's %{http_code} when no HTTP response was
          # received at all (DNS failure, connection refused, timeout); `|| echo 000`
          # would DOUBLE that to "000000" (curl's own "000" plus the fallback's),
          # which then fails the equality check below and misreads UNREACHABLE as a
          # non-2xx code. `|| true` only stops `set -e` from killing the script on
          # curl's nonzero exit; the "000" already captured is curl's, unaltered.
          code1=$(curl -s -o "$f1" -w '%{http_code}' "${base}/${sha:-main}/.github/workflows/build.yml" || true)
          code2=$(curl -s -o "$f2" -w '%{http_code}' "${base}/${sha:-main}/.github/workflows/build_next.yml" || true)
          if [ "$code1" = "000" ] || [ "$code2" = "000" ]; then
            echo "::notice::could not reach the community registry; the pin was checked against the local constants only"
            mode="NOT checked against the registry (unreachable); local constants ${DUCKDB_VERSION}/${DUCKDB_NEXT} only"
          elif [ "${code1#2}" = "$code1" ]; then
            url="${base}/${sha:-main}/.github/workflows/build.yml"
            echo "::error::community registry returned HTTP ${code1} for ${url}"
            echo "duckdb-pin: FAILED, registry returned ${code1} for ${url}" >> "$summary"; exit 1
          elif [ "${code2#2}" = "$code2" ]; then
            url="${base}/${sha:-main}/.github/workflows/build_next.yml"
            echo "::error::community registry returned HTTP ${code2} for ${url}"
            echo "duckdb-pin: FAILED, registry returned ${code2} for ${url}" >> "$summary"; exit 1
          else
            body=$(cat "$f1")
            next_body=$(cat "$f2")
            registry=$(printf '%s' "$body" | grep -m1 -o "inputs.duckdb_version || 'v[0-9][0-9.]*'" | grep -o "'v[0-9][0-9.]*'" | tr -d "'" || true)
            registry_next=$(printf '%s' "$next_body" | grep -m1 -o "duckdb_version: *'v[0-9][0-9.]*-[a-z]*'" | grep -o "'v[^']*'" | tr -d "'" || true)
            if [ -z "$registry" ] || [ -z "$registry_next" ]; then
              echo "::error::community-extensions at ${sha:-main} was fetched but build.yml/build_next.yml carry no recognisable duckdb_version (default='${registry}', next='${registry_next}'); this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry files fetched but unparseable" >> "$summary"; exit 1
            fi
            if [ "$registry" != "$DUCKDB_VERSION" ] || [ "$registry_next" != "$DUCKDB_NEXT" ]; then
              echo "::error::the community registry builds default=${registry} next=${registry_next} (at ${sha:-main}) but this repo ships default=${DUCKDB_VERSION} next=${DUCKDB_NEXT}; update the pin, the constants and the build jobs to the registry's lines"
              echo "duckdb-pin: FAILED, registry ${registry}/${registry_next} vs repo ${DUCKDB_VERSION}/${DUCKDB_NEXT}" >> "$summary"; exit 1
            fi
            mode="checked against the registry (default ${registry}, next ${registry_next}, at ${sha:-main})"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_VERSION}; ${n} job(s) shipping ${DUCKDB_VERSION} and ${m} job(s) shipping ${DUCKDB_NEXT}; ${mode}" | tee -a "$summary"

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: panduck

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: panduck
      format_checks: 'format'

  # Panduck deliberately does not link pandoc, so nothing in the build above would
  # notice if pandoc changed its AST underneath us. This job installs a real pandoc and
  # diffs its emitted constructor set against src/pandoc_ast_map.cpp.
  #
  # It runs independently of the build: the check reads the C++ table as text, so it
  # needs no compiled extension and gives a fast, standalone signal.
  pandoc-alignment:
    name: Pandoc AST alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version | head -1

      - name: Check AST mapping against the installed pandoc
        run: python3 test/pandoc/check_pandoc_alignment.py

  # Differential validation: read each fixture with BOTH panduck and pandoc and compare
  # at declared levels of equivalence (see test/roundtrip/).
  #
  # This does NOT rebuild panduck. Building the extension takes ~40 minutes, and the
  # matrix above has already done it -- so this downloads that job's linux_amd64
  # artifact and LOADs it into a stock DuckDB CLI of the same version. Runs in ~2
  # minutes instead.
  #
  # --require is deliberate: without it the check skips when a prerequisite is missing,
  # which in CI would report coverage it is not providing. A missing pandoc, CLI or
  # artifact must fail this job, not quietly pass it.
  roundtrip-validation:
    name: Differential validation (panduck vs pandoc)
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version | head -1

      # Unzip into its own directory: the archive contains a file named `duckdb`, and
      # the checkout already has a `duckdb/` SUBMODULE directory. Extracting in place
      # makes unzip prompt to overwrite it, which on a runner reads EOF and exits 1.
      - name: Install DuckDB CLI v1.5.5
        run: |
          curl -sSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          unzip -q -o duckdb.zip -d duckdb-cli
          chmod +x duckdb-cli/duckdb
          test -x duckdb-cli/duckdb || { echo "duckdb CLI not where expected"; exit 1; }
          ./duckdb-cli/duckdb --version

      - name: Download the panduck extension built above
        uses: actions/download-artifact@v4
        with:
          name: panduck-v1.5.5-extension-linux_amd64
          path: ext

      - name: Differential validation
        run: |
          EXT=$(find ext -name 'panduck.duckdb_extension' | head -1)
          echo "extension: $EXT"
          python3 test/roundtrip/check_roundtrip.py \
            --require --duckdb ./duckdb-cli/duckdb --extension "$EXT"

      # WORD LOSS, in the same job because it needs exactly what this job already has:
      # pandoc, a stock CLI, and the built artifact. It is the strongest format-agnostic
      # audit in the repo -- words pandoc sees that panduck does not -- and it is the
      # invariant the DOCX hyperlink bug violated. It had never run in CI (#59).
      #
      # --strict IS LOAD-BEARING, NOT DECORATION. Without it, every prerequisite miss --
      # no duckdb, no pandoc, no fixture -- prints a line and returns 0, so this step
      # would go green forever having measured nothing. Wiring an orphaned guard without
      # its strict flag creates a new instance of exactly the defect the guard exists to
      # catch. Same reason check_roundtrip.py above is passed --require.
      - name: Word loss (pandoc sees words panduck does not)
        run: |
          EXT=$(find ext -name 'panduck.duckdb_extension' | head -1)
          python3 scripts/check_word_loss.py \
            --strict --duckdb ./duckdb-cli/duckdb --extension "$EXT"

  # FIXTURE DRIFT AT THE pdf / markdown / webbed BOUNDARY.
  #
  # panduck's markdown, html and pdf readers are not panduck's code -- they dispatch to
  # community extensions that move independently. When they move, panduck's OUTPUT changes
  # with no commit in this repo and nothing announces it. That already happened once during
  # development: duck_block_utils went spec 6.3 -> 6.5 and markdown 340c0cd -> 75e9d0b in
  # the registry, and extraction behaviour changed with them.
  #
  # This job re-parses each source with whatever those extensions are TODAY and diffs the
  # blocks against test/fixtures/parsed/. It answers one question: would today's readers
  # still produce these fixtures?
  #
  # A SEPARATE JOB, NOT PART OF THE SUITE, and that split is the design. The unit tests read
  # the STORED blocks and need no reader at all -- that is what makes pdf-derived behaviour
  # assertable on a clean runner. This job needs every reader installed. Merging them would
  # give up the dependency-free suite AND report drift as an assertion failure rather than
  # as drift.
  #
  # Like roundtrip-validation, it downloads the already-built extension instead of rebuilding
  # (~40 min) and loads it into a stock CLI.
  parsed-fixture-drift:
    name: Parsed fixture drift (upstream readers)
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DuckDB CLI v1.5.5
        run: |
          curl -sSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          unzip -q -o duckdb.zip -d duckdb-cli
          chmod +x duckdb-cli/duckdb
          ./duckdb-cli/duckdb --version

      - name: Download the panduck extension built above
        uses: actions/download-artifact@v4
        with:
          name: panduck-v1.5.5-extension-linux_amd64
          path: ext

      # The script FAILS rather than skips when a reader is missing -- a skip would report
      # coverage this job is not providing, the same reasoning as check_roundtrip.py's
      # --require.
      - name: Would today's readers still produce these fixtures?
        run: |
          EXT=$(find ext -name 'panduck.duckdb_extension' | head -1)
          echo "extension: $EXT"
          python3 scripts/parsed_fixtures.py --check \
            --duckdb ./duckdb-cli/duckdb --extension "$EXT"

  # The .wasm is linked by a SEPARATE emcc -sSIDE_MODULE=2 step that reads only
  # DUCKDB_EXTENSION_PANDUCK_LINKED_LIBS -- target_link_libraries() is ignored there.
  # A dependency missing from that list is left as an unresolved import: the build is
  # green, the artifact uploads, and the module throws on first call in the browser.
  # The matrix above BUILDS the wasm but never instantiates it, so nothing upstream of
  # this job can see the difference. Three sibling repos shipped this bug.
  #
  # Static parse only -- no duckdb-wasm runtime and no version match -- so a failure
  # here is unambiguously the link bug rather than an ABI mismatch.
  wasm-symbol-check:
    name: WASM unresolved-symbol check
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No name filter: this pulls every artifact from the run, so the check does not
      # silently skip if the wasm artifact naming changes. run_wasm_checks.sh exits
      # non-zero when it finds no .wasm at all, which is the failure we want.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check wasm modules for unresolved dependency symbols
        run: test/wasm/run_wasm_checks.sh artifacts
