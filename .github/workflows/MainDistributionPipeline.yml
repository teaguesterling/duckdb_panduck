#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # `push` IS RESTRICTED TO main. Unrestricted, a branch push and that branch's
  # `pull_request` event both fire on the same commit, so every PR commit was built
  # TWICE -- two full matrices competing for the same runners. A branch with no PR now
  # gets no run, which is the intended trade: open the PR and it is built once.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# github.event_name IS PART OF THE KEY, and leaving it out is why this repo kept
# reporting red on green commits. `push` and `workflow_dispatch` on the same ref share
# a ref and a sha, so with cancel-in-progress they shared a group and each cancelled
# the other -- and GitHub reports a CANCELLED job on a commit as a FAILURE. Both merge
# runs for PRs #12 and #13 died this way, leaving main's tip with no completed run at
# all while every local gate was green.
#
# Diagnosed in webbed from the identical symptom, and confirmed in duck_block_utils,
# where adding this one component let a dispatch and a push run for the same sha
# complete side by side, both green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Forward-compat canary: intentionally builds against duckdb `main`, which is the
  # v2.0 line. duckdb/community-extensions builds every release PR against v2.0 via
  # build_next.yml and there is no per-extension opt-out, so a source break there is a
  # red check on every release. This job finds it here first.
  #
  # Advisory, NOT a merge blocker -- merge-readiness is judged on the stable build
  # below. Restricted to workflow_dispatch and pushes to main on purpose: `push` and
  # `pull_request` both fire on the same commit and a PR's check rollup includes both,
  # so an unrestricted canary would show red on every PR. And it must be `if:` rather
  # than `continue-on-error:` -- a job that calls a REUSABLE workflow accepts only a
  # fixed set of keys, and `continue-on-error` makes the whole file fail to parse,
  # scheduling zero jobs rather than one advisory one.
  # THE NEXT LINE, first-class. duckdb/community-extensions builds every descriptor
  # that carries ref_next against `v2.0-cyanoptera` (build_next.yml), so a PR is not
  # green here until it builds and tests there too. This was the canary until
  # 2026-09-13; Teague's dual-line ruling removed its gate.
  #
  # MATRIX WIDTH: the reusable workflow's reduced_ci_mode defaults to `auto`, which
  # builds three arches on pull requests (linux_amd64, windows_amd64, wasm_eh) and
  # the full matrix on pushes to main and on dispatch (markdown, measured
  # 2026-09-13). Kept on purpose: releases are cut from main after the push run, so
  # an arm64/macOS 2.0 break still surfaces before any descriptor PR. To build the
  # full matrix on PRs too, add `reduced_ci_mode: disabled` below; exclude_archs
  # can only narrow a matrix, never widen one.
  #
  # ONCE PER PR, ONCE PER MERGE. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so an ungated job here builds twice per
  # push (markdown, measured on 126739d). This gate runs it on every pull request,
  # on merges to main, and on dispatch; the one case it does not cover is a branch
  # with no PR open, which gets its first next-line build when the PR opens.
  #
  # PANDUCK'S HISTORY WITH THIS LINE, kept because it is why the line is first-class here:
  # this job used to build DuckDB `main`, and on 5a0331b it went green on every platform
  # while the registry's test_against_latest rejected that exact commit -- `main` still
  # pulled in duckdb/catalog/catalog.hpp transitively and v2.0-cyanoptera did not. It was
  # retargeted to that branch, then ungated on PRs (Teague, 2026-09-13, adopting the fleet
  # reference). panduck's `on: push` is already restricted to main, so the double build the
  # gate below prevents cannot occur here; the gate is copied verbatim anyway so every repo
  # carries the same line.
  duckdb-next-build:
    name: Build extension binaries (duckdb next, v2.0 line)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: panduck

  # ADVISORY canary on DuckDB main, the line beyond 2.0. Pushes to main and on
  # demand only: a push and a pull_request both fire on the same commit and a PR's
  # rollup includes both, so an unconditional job here would redden every PR for a
  # line nobody ships. `if:` rather than `continue-on-error:` because a job calling
  # a REUSABLE workflow accepts only a fixed set of keys.
  #   gh workflow run MainDistributionPipeline.yml --ref <branch>
  duckdb-main-canary:
    name: Build extension binaries (duckdb main canary)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: panduck

  # THREE ENCODINGS OF ONE FACT, asserted equal instead of maintained in parallel: the
  # duckdb submodule pin, the duckdb_version lines this workflow's build jobs ship, and the
  # lines the community registry builds. When they drift, the local build and the served
  # artifact are different software and nothing says so.
  #
  # Copied verbatim from duck_block_utils main at 82241ea (their PR #33, squash-merged; the
  # reviewed branch head was cf408b5, which is NOT in main's history, so compare against
  # 82241ea), so every repo in the fleet asserts the same rule the same way. The only
  # repo-specific line is `wf=`, this file's own name, which matches theirs. Its degraded
  # paths (unreachable is a NOTE; a non-200 fetch or an unparseable registry file is a
  # FAILURE) are documented inline in the run block below and deliberately NOT restated
  # here, so there is one description of them rather than two that can drift apart.
  #
  # THE AUTHORITY IS THE REGISTRY, not this job's constants: on 2026-09-13 panduck's
  # canary built DuckDB `main`, went green on 5a0331b, and the registry rejected that exact
  # commit for a v2.0-cyanoptera compile error.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    # Name kept as-is even though the rule is now "pin equals the registry default":
    # required-check configuration may key on this job name.
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v1.5.6
      DUCKDB_NEXT: v2.0-cyanoptera
      # Flip day (spec §3 step 3) keeps a duckdb-legacy-build at the outgoing version
      # for one release; set this to that version then so the stray-literal scan below
      # exempts it instead of flagging it. Empty the rest of the time.
      DUCKDB_LEGACY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Compare the submodule pin with the tag's commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # One variable, one edit point: every sibling repo copies this job
          # verbatim, and the greps and the stray-literal scan below all read
          # this same file.
          wf=.github/workflows/MainDistributionPipeline.yml
          want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}^{}" | cut -f1)
          [ -n "$want" ] || want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}" | cut -f1)
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "shipped tag ${DUCKDB_VERSION} -> ${want}"
          echo "submodule pin          -> ${have}"
          [ -n "$want" ] || { echo "::error::could not resolve tag ${DUCKDB_VERSION} upstream"; exit 1; }
          [ "$want" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the ${DUCKDB_VERSION} tag ${want}; run: git -C duckdb fetch --tags && git -C duckdb checkout ${DUCKDB_VERSION}"; exit 1; }
          n=$(grep -c "duckdb_version: ${DUCKDB_VERSION}$" "$wf" || true)
          [ "$n" -ge 1 ] || { echo "::error::no build job in this workflow ships duckdb_version: ${DUCKDB_VERSION}; this job's constant has drifted"; exit 1; }
          m=$(grep -c "duckdb_version: ${DUCKDB_NEXT}$" "$wf" || true)
          [ "$m" -ge 1 ] || { echo "::error::no build job in this workflow builds the next line duckdb_version: ${DUCKDB_NEXT}"; exit 1; }
          # NO OTHER DuckDB PATCH VERSION may drift from the shipped ${DUCKDB_VERSION}
          # anywhere else in this file: sibling workflows (yaml, mcp) embed a version
          # in artifact NAMES and CLI download URLs (e.g. `yaml-v1.5.4-extension-wasm_*`,
          # `releases/download/v1.5.4/duckdb_cli`) that the `duckdb_version:` greps above
          # cannot see, so a bump left them stale and this job went green over a red
          # build. Comment lines (first non-space char `#`) are exempt, and so are
          # `uses:` lines (a `- uses:` list item too): a third-party action pin like
          # `@v2.0.4` is not a DuckDB version. Branch/tag names like `v2.0-cyanoptera`
          # and `v1.5-variegata` have no third numeric component and so never match
          # this pattern. DUCKDB_LEGACY, when set (flip day, see above), is exempt too.
          bad=0
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            for v in $(printf '%s\n' "$line" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true); do
              if [ "$v" != "$DUCKDB_VERSION" ]; then
                if [ -n "$DUCKDB_LEGACY" ] && [ "$v" = "$DUCKDB_LEGACY" ]; then
                  continue
                fi
                echo "::error::line ${lineno}: ${line} -- a DuckDB version literal that is not the shipped ${DUCKDB_VERSION}: derive it from the shipped version or bump it"
                bad=1
              fi
            done
          done < <(grep -nE 'v[0-9]+\.[0-9]+\.[0-9]+' "$wf" || true)
          [ "$bad" -eq 0 ] || exit 1
          # THE AUTHORITY is the registry's own files, not this job's constants: a
          # constant checked only against itself passes for a year after the registry
          # moves (panduck, 2026-09-13). Resolve main to a sha first so the raw fetches
          # are not served from the branch cache. THREE degraded paths, deliberately
          # different: UNREACHABLE (curl itself failed, HTTP code 000) is the world
          # being unavailable -> a NOTE, and the summary says the registry assertions
          # were not made, with only the local-constant assertions above run; a
          # non-2xx HTTP code (e.g. a renamed/removed registry file) is this check
          # asking the world a well-formed question and getting told no -> a FAILURE
          # naming the code and URL (a bare `curl -sf` would have mistaken this for
          # UNREACHABLE and measured nothing); REACHABLE, 2xx, BUT UNPARSEABLE is this
          # check being wrong about the file's content -> also a FAILURE.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          base="https://raw.githubusercontent.com/duckdb/community-extensions"
          # An Authorization: Bearer header with an EMPTY token is not "no header": GitHub
          # answers 401 to it, worse than sending no header at all (confirmed empirically).
          # An unauthenticated local run (no GITHUB_TOKEN, which the docs tell maintainers
          # to run) would then always miss sha resolution and fall back to the `main` REF
          # NAME, comparing against whatever the branch URL's cache happens to be serving --
          # the exact staleness this sha-resolution step exists to avoid. So the header is
          # added only when a token is actually present; CI always has one.
          auth=(); [ -n "${GITHUB_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          sha=$(curl -sf "${auth[@]}" https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          f1=$(mktemp); f2=$(mktemp)
          # curl itself writes 000 to -w's %{http_code} when no HTTP response was
          # received at all (DNS failure, connection refused, timeout); `|| echo 000`
          # would DOUBLE that to "000000" (curl's own "000" plus the fallback's),
          # which then fails the equality check below and misreads UNREACHABLE as a
          # non-2xx code. `|| true` only stops `set -e` from killing the script on
          # curl's nonzero exit; the "000" already captured is curl's, unaltered.
          code1=$(curl -s -o "$f1" -w '%{http_code}' "${base}/${sha:-main}/.github/workflows/build.yml" || true)
          code2=$(curl -s -o "$f2" -w '%{http_code}' "${base}/${sha:-main}/.github/workflows/build_next.yml" || true)
          if [ "$code1" = "000" ] || [ "$code2" = "000" ]; then
            echo "::notice::could not reach the community registry; the pin was checked against the local constants only"
            mode="NOT checked against the registry (unreachable); local constants ${DUCKDB_VERSION}/${DUCKDB_NEXT} only"
          elif [ "${code1#2}" = "$code1" ]; then
            url="${base}/${sha:-main}/.github/workflows/build.yml"
            echo "::error::community registry returned HTTP ${code1} for ${url}"
            echo "duckdb-pin: FAILED, registry returned ${code1} for ${url}" >> "$summary"; exit 1
          elif [ "${code2#2}" = "$code2" ]; then
            url="${base}/${sha:-main}/.github/workflows/build_next.yml"
            echo "::error::community registry returned HTTP ${code2} for ${url}"
            echo "duckdb-pin: FAILED, registry returned ${code2} for ${url}" >> "$summary"; exit 1
          else
            body=$(cat "$f1")
            next_body=$(cat "$f2")
            registry=$(printf '%s' "$body" | grep -m1 -o "inputs.duckdb_version || 'v[0-9][0-9.]*'" | grep -o "'v[0-9][0-9.]*'" | tr -d "'" || true)
            registry_next=$(printf '%s' "$next_body" | grep -m1 -o "duckdb_version: *'v[0-9][0-9.]*-[a-z]*'" | grep -o "'v[^']*'" | tr -d "'" || true)
            if [ -z "$registry" ] || [ -z "$registry_next" ]; then
              echo "::error::community-extensions at ${sha:-main} was fetched but build.yml/build_next.yml carry no recognisable duckdb_version (default='${registry}', next='${registry_next}'); this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry files fetched but unparseable" >> "$summary"; exit 1
            fi
            if [ "$registry" != "$DUCKDB_VERSION" ] || [ "$registry_next" != "$DUCKDB_NEXT" ]; then
              echo "::error::the community registry builds default=${registry} next=${registry_next} (at ${sha:-main}) but this repo ships default=${DUCKDB_VERSION} next=${DUCKDB_NEXT}; update the pin, the constants and the build jobs to the registry's lines"
              echo "duckdb-pin: FAILED, registry ${registry}/${registry_next} vs repo ${DUCKDB_VERSION}/${DUCKDB_NEXT}" >> "$summary"; exit 1
            fi
            mode="checked against the registry (default ${registry}, next ${registry_next}, at ${sha:-main})"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_VERSION}; ${n} job(s) shipping ${DUCKDB_VERSION} and ${m} job(s) shipping ${DUCKDB_NEXT}; ${mode}" | tee -a "$summary"

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: panduck

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: panduck
      format_checks: 'format'

  # SINGLE-ARROW LAMBDAS IN SQL STRINGS (#65). DuckDB 1.5.5 prints a deprecation WARNING on
  # stdout for `x -> ...` -- inside every consumer's output -- and from 2.0 the default
  # lambda_syntax rejects it at bind time. A static scan rather than a test, because the expand
  # macro's lambdas reference parse_markdown_to_duck_blocks and so are never bound on a runner
  # without the markdown extension. The script self-tests before scanning and exits 2 if its
  # own detection is broken, so a green run cannot mean "found nothing because it looked at
  # nothing". Needs no build, no DuckDB, no network: seconds.
  lambda-syntax:
    name: No single-arrow lambdas in SQL strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan src/ for single-arrow lambdas
        run: python3 scripts/check_lambda_syntax.py

  # libpanduck/ IS OUTSIDE THE REPO'S FORMAT GATE, and this job is the fix (#104).
  #
  # extension-ci-tools' Code Quality Check runs
  #   format.py --all --check --directories src test
  # so it says nothing about libpanduck/ -- and had said nothing since the first file
  # moved behind the seam. Two files had quietly accumulated over-120-column lines from
  # their `DuckBlockTypes::` -> `DuckBlockVocabulary::` renames.
  #
  # WHY A SEPARATE JOB rather than a step on libpanduck-seam: that job advertises "no
  # submodules, no extension build, no network", and that is a property worth keeping --
  # it is the fastest signal in the pipeline. This check needs the OPPOSITE: format.py
  # lives in duckdb/scripts/ and .clang-format is a SYMLINK into the submodule, so
  # without it the symlink dangles and clang-format silently falls back to its built-in
  # style. Measured locally: that dangling symlink has already cost one debugging cycle
  # on this repo.
  #
  # Hence submodules with fetch-depth 1 -- a shallow duckdb is enough for two config
  # files and a script, and this job never builds anything.
  libpanduck-format:
    name: libpanduck formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      # EXACT VERSIONS, because format.py enforces them and exits -1 otherwise
      # (duckdb/scripts/format.py:22-50):
      #   black >= 24        -- checked even though nothing here is Python; the
      #                         version gate runs before any --directories filtering
      #   clang-format 11.x  -- an unpinned `pip install clang-format` gets a modern
      #                         major and is REJECTED, not merely different. 11.0.1 is
      #                         what the repo formats with locally.
      #   cmake-format       -- unpinned; format.py only checks it runs
      # Found by reading format.py rather than by watching this job fail: the first
      # draft of this step installed `clang-format cmake-format` unpinned and no
      # black, which would have failed on the version gate and looked like a
      # formatting problem.
      - name: Install the formatters format.py requires
        run: pip install "black>=24" clang_format==11.0.1 cmake-format
      - name: Check libpanduck formatting
        run: make format-check-libpanduck

  # THE libpanduck SEAM (#104): the format engine must not name DuckDB.
  #
  # TWO CHECKS, BECAUSE THE COMPILER CANNOT BE THE ONLY ONE. panduck's CMakeLists
  # applies include_directories() directory-wide and duckdb's own paths arrive from
  # the parent scope, so a target declared there inherits them -- a stray
  # `#include "duckdb.hpp"` under libpanduck/ would compile perfectly in the
  # extension build. Configuring libpanduck STANDALONE is the real enforcement,
  # because that project never puts duckdb on the include path; the grep is the
  # fast signal that names the offending line.
  #
  # BOTH ANSWERS PINNED before this job was written, rather than only the passing
  # one: with `#include "duckdb.hpp"` added to libpanduck/src/panduck.cpp the
  # standalone build fails with `fatal error: duckdb.hpp: No such file` AND the
  # guard reports the leak; with it removed, both pass. A detector tested only on
  # the side we expect to pass is half-checked.
  #
  # No submodules, no extension build, no network: the vocabulary header is a
  # tracked file, so this is seconds.
  libpanduck-seam:
    name: libpanduck names no DuckDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan libpanduck/ for DuckDB
        run: python3 scripts/check_libpanduck_seam.py
      - name: Build libpanduck standalone
        run: |
          cmake -S libpanduck -B build/libpanduck
          cmake --build build/libpanduck

      # THE SEAM GETTING TEETH (#104, L2). The two steps above prove libpanduck
      # names no DuckDB and COMPILES with no duckdb on the include path. Neither
      # proves a module WORKS without DuckDB: until this step, every assertion
      # about ReadOrg, ReadRst, ReadLatex, ReadMediaWiki, ReadTextile and
      # ReadIpynb ran through SQL in test/sql/*.test, i.e. through DuckDB.
      #
      # This runs the vocabulary rows through a process with no DuckDB in it at
      # all. The centrepiece is that `encoding` is non-empty on every row:
      # ::panduck::Block defaults it to "" while the per-reader row structs L1
      # deleted defaulted it to ENCODING_TEXT, so a flatten that forgets to
      # assign it blanks every row with no compile error and -- before this --
      # no failing test.
      #
      # No -D flags, matching the build above, so this takes the DEFAULTS:
      # latex, mediawiki, org, rst, rtf and textile. docx, epub, ipynb, odt and
      # zip are OFF here because each one's default is conditional on
      # find_package() locating yyjson, miniz or pugixml and none of the three is
      # on an ubuntu-latest image (see libpanduck/CMakeLists.txt). The runner
      # prints the number of checks it EXECUTED and exits non-zero if that is
      # zero, so a configure that switched every module off could not pass.
      #
      # THAT IS NOW THE DEPS-FREE ARM OF TWO, not the whole of the enforcement
      # (#124). libpanduck-seam-all-modules below compiles all eleven, and this
      # job is deliberately left taking the defaults: it keeps the fast signal,
      # and it is what actually exercises the FALSE arms of test_engine.cpp's
      # HasModule() pins. Do NOT add -D flags here -- doing so would leave those
      # arms pinned but never run, which is the half-test this project refuses.
      - name: Run libpanduck standalone tests
        run: ctest --test-dir build/libpanduck --output-on-failure --verbose

  # THE SEAM GATE WITH EVERY MODULE ON (#124). The job above is the FAST ARM and
  # takes the configure DEFAULTS, which means it compiles 6 of the 11 modules.
  # docx, epub, ipynb, odt and zip default OFF on a bare runner because each one's
  # default is conditional on find_package() locating yyjson, miniz or pugixml, and
  # none of the three is on an ubuntu-latest image. Measured on 333ac3e by
  # replicating that configure with the vcpkg environment stripped:
  #
  #   docx=OFF epub=OFF ipynb=OFF odt=OFF zip=OFF
  #   latex=ON mediawiki=ON org=ON rst=ON rtf=ON textile=ON   -> 125 checks
  #
  # That gap is the whole defect. The seam-move contract tells every mover that the
  # standalone build is THE compile-level enforcement -- check_libpanduck_seam.py is
  # a grep and sees only NAMED DuckDB types, so a transitive include, the C++11
  # aggregate trap and a C++11 ODR-use link failure are caught by nothing else --
  # and the five modules it did not cover are exactly the ones where that costs
  # most. The aggregate trap has already been hit twice in this repo (latex `Token`,
  # an odt-local `struct Entry`) and is invisible to the extension's C++17 build.
  #
  # A SECOND JOB, NOT A STEP ON THE ONE ABOVE. That job advertises "no submodules,
  # no extension build, no network: this is seconds", and that property is worth
  # keeping: it is the one compile gate that still reports when everything else is
  # broken. This job needs the opposite of all three. Running them as two arms in
  # parallel keeps the fast signal fast and, just as important, keeps the deps-free
  # configure exercised for real -- which is what the FALSE arms of
  # libpanduck/test/test_engine.cpp's HasModule() pins assert.
  #
  # WHY vcpkg AND NOT apt. Measured 2026-10-10 against ubuntu noble, the archive
  # ubuntu-latest draws from: `apt-cache policy libyyjson-dev libminiz-dev
  # libpugixml-dev` returns a candidate for pugixml ONLY. yyjson and miniz are not
  # packaged at all -- `apt-cache search miniz` offers only minizip, a different
  # library. And even where a package does exist, these are located through
  # find_package(... CONFIG): a Debian -dev package that ships headers with no CMake
  # config file makes find_package fail, which flips the module default OFF and lets
  # this job go green having compiled nothing new. That is this very bug wearing a
  # passing check, so apt is not merely inconvenient here, it is the failure mode.
  # vcpkg builds all three as CONFIG packages, which is what libpanduck/CMakeLists.txt
  # and the root CMakeLists already consume.
  #
  # DRIVEN BY THE REPO'S OWN vcpkg.json, so the dependency set keeps ONE encoding
  # instead of a second copy here that can drift from the extension build's. Manifest
  # mode needs the extension-ci-tools submodule, because vcpkg.json's
  # vcpkg-configuration names ./extension-ci-tools/vcpkg_ports as an overlay; with
  # that directory absent vcpkg exits 1 with `Overlay path ... must be an existing
  # directory` (measured), so the dependency on it is loud rather than a silent
  # resolution against different ports. It is 276K and a --depth 1 init of the pinned
  # sha succeeds, so this is nothing like a duckdb checkout.
  libpanduck-seam-all-modules:
    name: libpanduck standalone, every module ON
    runs-on: ubuntu-latest
    env:
      # The triplet for the vcpkg install and for CMAKE_PREFIX_PATH. The cache key
      # below spells it out literally instead of reading this, because the contexts
      # a `with:` expression may use are not guaranteed to include `env` and an
      # unrecognised named-value does not fail the step -- it fails the whole file to
      # parse, which schedules NO jobs and looks exactly like a green run.
      #
      # The duplication is safe rather than merely tolerated: if the two ever
      # disagreed, a cache hit would restore a tree under the other triplet,
      # find_package would locate nothing, and the all-modules assertion below would
      # fire. The gate backstops its own cache.
      TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@v4

      # Keyed on vcpkg.json, so only a dependency change pays the build. On a hit
      # BOTH steps below are skipped and the job touches no network at all -- which
      # is why the cache is restored before the submodule is fetched, not after.
      - name: Cache the built dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: libpanduck-deps-${{ runner.os }}-x64-linux-${{ hashFiles('vcpkg.json') }}

      # extension-ci-tools ONLY, not `submodules: true`: that would also fetch
      # duckdb, which this job never builds against and which dwarfs everything else
      # here. Needed solely so vcpkg.json's overlay-ports path resolves, hence
      # skipped whenever the vcpkg step below is.
      - name: Check out extension-ci-tools (vcpkg.json's overlays point into it)
        if: steps.deps.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 extension-ci-tools

      - name: Build yyjson, miniz and pugixml from vcpkg.json
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -uo pipefail
          # The ubuntu-latest image ships vcpkg already bootstrapped, which saves a
          # clone and a compile. If a future image drops it, fail HERE with the
          # remedy named, rather than further down where a missing dependency reads
          # as a dependency problem: the fix would be a pinned microsoft/vcpkg
          # checkout plus bootstrap-vcpkg.sh in this step.
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ] || [ ! -x "${VCPKG_INSTALLATION_ROOT}/vcpkg" ]; then
            echo "::error::no bootstrapped vcpkg on this runner (VCPKG_INSTALLATION_ROOT=${VCPKG_INSTALLATION_ROOT:-unset}); add a pinned microsoft/vcpkg checkout and bootstrap-vcpkg.sh to this step"
            exit 1
          fi
          # --x-install-root is manifest mode's default already; stated anyway
          # because the cache path above and CMAKE_PREFIX_PATH below both name it,
          # and this job's entire subject is what happens when a default moves.
          "${VCPKG_INSTALLATION_ROOT}/vcpkg" install \
            --triplet "$TRIPLET" \
            --x-install-root="$PWD/vcpkg_installed"

      # EXPLICIT -D FOR EVERY MODULE, never auto-detection. The defect was a default
      # flipping OFF unnoticed, so this states all eleven and the next step asserts
      # the configure agreed. A dependency going missing now has to CONTRADICT an
      # explicit ON, which is something a check can see.
      - name: Configure libpanduck with every module ON
        run: |
          set -uo pipefail
          cmake -S libpanduck -B build/libpanduck-all \
            -DPANDUCK_WITH_DOCX=ON \
            -DPANDUCK_WITH_EPUB=ON \
            -DPANDUCK_WITH_IPYNB=ON \
            -DPANDUCK_WITH_LATEX=ON \
            -DPANDUCK_WITH_MEDIAWIKI=ON \
            -DPANDUCK_WITH_ODT=ON \
            -DPANDUCK_WITH_ORG=ON \
            -DPANDUCK_WITH_RST=ON \
            -DPANDUCK_WITH_RTF=ON \
            -DPANDUCK_WITH_TEXTILE=ON \
            -DPANDUCK_WITH_ZIP=ON \
            -DCMAKE_PREFIX_PATH="$PWD/vcpkg_installed/$TRIPLET" \
            > configure.log 2>&1
          rc=$?
          cat configure.log
          exit $rc

      # THE ASSERTION THIS WHOLE JOB EXISTS FOR, and the one line here worth reading
      # twice. Without it the job can pass while compiling precisely what the fast
      # arm already compiles: a dependency goes missing, find_package fails, each
      # dependent module's default is conditional on it, the configure prints =OFF
      # and exits 0, and the build and the tests are then green over the same 6
      # modules as before. Nothing else in the pipeline would notice.
      #
      # It fails on =OFF *and* on any module the line does not mention, so renaming
      # or dropping one in the message() at the foot of libpanduck/CMakeLists.txt
      # cannot quietly make this vacuous. A missing line is likewise a failure: a
      # green run must mean the modules were checked, never that there was nothing
      # found to check.
      #
      # `grep -o` is deliberately not the test. It exits 1 on zero matches, and zero
      # matches is the PASSING case here, so using it as the condition inverts the
      # gate.
      - name: Fail if the configure switched any module OFF
        run: |
          set -uo pipefail
          line=$(grep -F 'libpanduck modules:' configure.log | tail -1)
          if [ -z "$line" ]; then
            echo "::error::the configure printed no 'libpanduck modules:' line, so no module state was verified; if the message() in libpanduck/CMakeLists.txt was reworded, update this check alongside it"
            exit 1
          fi
          echo "$line"
          bad=0
          for m in docx epub ipynb latex mediawiki odt org rst rtf textile zip; do
            case "$line" in
            *"$m=ON"*)
              ;;
            *"$m=OFF"*)
              echo "::error::module ${m} configured OFF; this job must compile every module, so check that vcpkg really provided yyjson, miniz and pugixml and that CMAKE_PREFIX_PATH points at them"
              bad=1
              ;;
            *)
              echo "::error::the module line never mentions ${m}, so its state is unknown and this gate is not covering it: ${line}"
              bad=1
              ;;
            esac
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "all 11 modules configured ON"

      - name: Build libpanduck standalone
        run: cmake --build build/libpanduck-all

      # --verbose because the per-module tally the next step reads comes from the
      # runner's own stdout, and --output-on-failure alone prints nothing on success.
      - name: Run libpanduck standalone tests
        run: |
          set -uo pipefail
          ctest --test-dir build/libpanduck-all --output-on-failure --verbose > ctest.log 2>&1
          rc=$?
          cat ctest.log
          exit $rc

      # A FLOOR, NOT AN EXPECTATION. 147 is what the eleven-module build executed on
      # 333ac3e across the 7 test-bearing modules; adding tests raises the real
      # number and must not redden this job, which is why the comparison is >= and
      # not ==. What it catches is a green ctest over the WRONG binary -- an all-ON
      # configure whose suite nonetheless ran the 125 checks the defaults-only arm
      # runs. Raise the floor when a module gains its first tests; never lower it.
      #
      # docx, epub, odt, rtf and zip compile here but contribute no checks of their
      # own: they have no test files yet, which is tracked separately. So this number
      # moves when those are written, not when those modules were switched on.
      - name: Assert the suite ran the all-modules check count
        run: |
          set -uo pipefail
          total=$(sed -nE 's/^.*TOTAL[[:space:]]+([0-9]+) checks.*$/\1/p' ctest.log | tail -1)
          if [ -z "$total" ]; then
            echo "::error::no TOTAL line in the ctest output, so the number of checks executed was never verified"
            exit 1
          fi
          echo "libpanduck standalone executed ${total} checks across every module"
          if [ "$total" -lt 147 ]; then
            echo "::error::only ${total} checks ran; the eleven-module build executed 147 on 333ac3e and the defaults-only arm executes 125, so this looks like an all-ON configure whose suite did not take"
            exit 1
          fi

  # Panduck deliberately does not link pandoc, so nothing in the build above would
  # notice if pandoc changed its AST underneath us. This job installs a real pandoc and
  # diffs its emitted constructor set against src/pandoc_ast_map.cpp.
  #
  # It runs independently of the build: the check reads the C++ table as text, so it
  # needs no compiled extension and gives a fast, standalone signal.
  # WHICH TEST FILES ARE BEING SKIPPED (#34, #59). sqllogictest reports skips as a count by
  # reason and never names the files: on a clean extension directory -- which is what this
  # runner has -- that is 5 whole files and 238 assertions gone under a summary that reads
  # "All tests passed".
  #
  # This job runs the STATIC mode, which predicts a skip from its cause in the test file (a
  # bare INSTALL of a community extension 404s here; a require-env gates the file) and fails
  # on one nothing declares. It needs no build and no DuckDB, which is why it can run here at
  # all -- the runtime mode drives the unittest binary and lives in `make check`. Measured:
  # the two modes name the SAME 9 files on a clean extension directory.
  test-skips:
    name: Every skipped test file is declared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which test files will be skipped, and is each one declared?
        run: python3 scripts/check_test_skips.py --static

  pandoc-alignment:
    name: Pandoc AST alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version | head -1

      - name: Check AST mapping against the installed pandoc
        run: python3 test/pandoc/check_pandoc_alignment.py

  # Differential validation: read each fixture with BOTH panduck and pandoc and compare
  # at declared levels of equivalence (see test/roundtrip/).
  #
  # This does NOT rebuild panduck. Building the extension takes ~40 minutes, and the
  # matrix above has already done it -- so this downloads that job's linux_amd64
  # artifact and LOADs it into a stock DuckDB CLI of the same version. Runs in ~2
  # minutes instead.
  #
  # --require is deliberate: without it the check skips when a prerequisite is missing,
  # which in CI would report coverage it is not providing. A missing pandoc, CLI or
  # artifact must fail this job, not quietly pass it.
  roundtrip-validation:
    name: Differential validation (panduck vs pandoc)
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version | head -1

      # Unzip into its own directory: the archive contains a file named `duckdb`, and
      # the checkout already has a `duckdb/` SUBMODULE directory. Extracting in place
      # makes unzip prompt to overwrite it, which on a runner reads EOF and exits 1.
      - name: Install DuckDB CLI v1.5.6
        run: |
          curl -sSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q -o duckdb.zip -d duckdb-cli
          chmod +x duckdb-cli/duckdb
          test -x duckdb-cli/duckdb || { echo "duckdb CLI not where expected"; exit 1; }
          ./duckdb-cli/duckdb --version

      - name: Download the panduck extension built above
        uses: actions/download-artifact@v4
        with:
          name: panduck-v1.5.6-extension-linux_amd64
          path: ext

      - name: Differential validation
        run: |
          EXT=$(find ext -name 'panduck.duckdb_extension' | head -1)
          echo "extension: $EXT"
          python3 test/roundtrip/check_roundtrip.py \
            --require --duckdb ./duckdb-cli/duckdb --extension "$EXT"

      # WORD LOSS, in the same job because it needs exactly what this job already has:
      # pandoc, a stock CLI, and the built artifact. It is the strongest format-agnostic
      # audit in the repo -- words pandoc sees that panduck does not -- and it is the
      # invariant the DOCX hyperlink bug violated. It had never run in CI (#59).
      #
      # --strict IS LOAD-BEARING, NOT DECORATION. Without it, every prerequisite miss --
      # no duckdb, no pandoc, no fixture -- prints a line and returns 0, so this step
      # would go green forever having measured nothing. Wiring an orphaned guard without
      # its strict flag creates a new instance of exactly the defect the guard exists to
      # catch. Same reason check_roundtrip.py above is passed --require.
      - name: Word loss (pandoc sees words panduck does not)
        run: |
          EXT=$(find ext -name 'panduck.duckdb_extension' | head -1)
          python3 scripts/check_word_loss.py \
            --strict --duckdb ./duckdb-cli/duckdb --extension "$EXT"

  # FIXTURE DRIFT AT THE pdf / markdown / webbed BOUNDARY.
  #
  # panduck's markdown, html and pdf readers are not panduck's code -- they dispatch to
  # community extensions that move independently. When they move, panduck's OUTPUT changes
  # with no commit in this repo and nothing announces it. That already happened once during
  # development: duck_block_utils went spec 6.3 -> 6.5 and markdown 340c0cd -> 75e9d0b in
  # the registry, and extraction behaviour changed with them.
  #
  # This job re-parses each source with whatever those extensions are TODAY and diffs the
  # blocks against test/fixtures/parsed/. It answers one question: would today's readers
  # still produce these fixtures?
  #
  # A SEPARATE JOB, NOT PART OF THE SUITE, and that split is the design. The unit tests read
  # the STORED blocks and need no reader at all -- that is what makes pdf-derived behaviour
  # assertable on a clean runner. This job needs every reader installed. Merging them would
  # give up the dependency-free suite AND report drift as an assertion failure rather than
  # as drift.
  #
  # Like roundtrip-validation, it downloads the already-built extension instead of rebuilding
  # (~40 min) and loads it into a stock CLI.
  parsed-fixture-drift:
    name: Parsed fixture drift (upstream readers)
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DuckDB CLI v1.5.6
        run: |
          curl -sSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q -o duckdb.zip -d duckdb-cli
          chmod +x duckdb-cli/duckdb
          ./duckdb-cli/duckdb --version

      - name: Download the panduck extension built above
        uses: actions/download-artifact@v4
        with:
          name: panduck-v1.5.6-extension-linux_amd64
          path: ext

      # The script FAILS rather than skips when a reader is missing -- a skip would report
      # coverage this job is not providing, the same reasoning as check_roundtrip.py's
      # --require.
      - name: Would today's readers still produce these fixtures?
        run: |
          EXT=$(find ext -name 'panduck.duckdb_extension' | head -1)
          echo "extension: $EXT"
          python3 scripts/parsed_fixtures.py --check \
            --duckdb ./duckdb-cli/duckdb --extension "$EXT"

  # The .wasm is linked by a SEPARATE emcc -sSIDE_MODULE=2 step that reads only
  # DUCKDB_EXTENSION_PANDUCK_LINKED_LIBS -- target_link_libraries() is ignored there.
  # A dependency missing from that list is left as an unresolved import: the build is
  # green, the artifact uploads, and the module throws on first call in the browser.
  # The matrix above BUILDS the wasm but never instantiates it, so nothing upstream of
  # this job can see the difference. Three sibling repos shipped this bug.
  #
  # Static parse only -- no duckdb-wasm runtime and no version match -- so a failure
  # here is unambiguously the link bug rather than an ABI mismatch.
  wasm-symbol-check:
    name: WASM unresolved-symbol check
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No name filter: this pulls every artifact from the run, so the check does not
      # silently skip if the wasm artifact naming changes. run_wasm_checks.sh exits
      # non-zero when it finds no .wasm at all, which is the failure we want.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check wasm modules for unresolved dependency symbols
        run: test/wasm/run_wasm_checks.sh artifacts

  # THE VENDORED duck_block VOCABULARY vs UPSTREAM'S RELEASE (#38).
  #
  # src/include/duck_block_vocabulary.hpp is a COPY of duck_block_utils' published
  # header, and a copy -- like a submodule pin, which is a copy with a sha attached --
  # does not notice when upstream moves. The C++ constants catch a RENAME, because
  # TYPE_HEADING -> TYPE_HEAD breaks the build at every use site. They are blind to a
  # changed VALUE: TYPE_PAGE = 'page_break' -> 'pagebreak' compiles clean, every test
  # written against its own string literals keeps passing, and the readers silently
  # stop emitting a type any consumer recognises. Nothing in C++ catches that; only
  # this check does.
  #
  # IT COMPARES AGAINST THE LATEST RELEASE, NOT main, which is the contract settled with
  # upstream's consumer check: spec releases are batched, so main can carry constants no
  # release has yet, and comparing against main reddened an up-to-date copy mid-batch.
  # DRIFT, EXTRA, SPEC and PROVENANCE fail. BEHIND PASSES -- re-vendor only when panduck
  # needs a constant, or a changed predicate answer, that a later minor added.
  #
  # WHY IT IS BLOCKING FROM THE START, measured rather than assumed (2026-10-08): run on
  # this tree it exits 0. The copy is two EXTENSION releases back -- stamped 95a84e6 =
  # v3.3.0 against release v3.5.0 -- and the report lists TYPE_DOCUMENT, ATTR_ID and
  # ATTR_NAME under BEHIND with spec 1.4 on both sides. By the rule above that is the
  # aligned state, not a failure, so wiring this as a gate does not red main. The
  # re-vendor is separate work; this job is what will say when it becomes necessary.
  #
  # WHAT IT CANNOT SEE: the GAPS arm counts a constant's VALUE appearing as a bare string
  # literal anywhere in the scanned sources, not only where it is compared against
  # duck_block vocabulary, so a short generic value collides with unrelated code and reads
  # as "handled" -- TYPE_FIGURE collides with a LaTeX environment name, VALUE_LIST with
  # TYPE_LIST. An empty GAPS section means "no gap this scan can SEE", not "no gap".
  #
  # --strict IS LOAD-BEARING, NOT DECORATION. Without it an unreachable upstream prints a
  # line and returns 0, so a network blip would go green having compared nothing -- the
  # same false green that --strict on check_word_loss.py exists to prevent. GITHUB_TOKEN
  # only lifts the unauthenticated API rate limit; the header it reads is public.
  #
  # No submodules, no extension build: a tracked header and two HTTPS reads, so seconds.
  duck-block-vocabulary:
    name: Vendored duck_block vocabulary matches upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The checker's own classification first: a drift guard that has stopped being able
      # to tell a value change from cosmetic churn reports the same clean output as one
      # that can. This asserts, among others, that BEHIND passes and EXTRA/CHANGED fail --
      # the exact arms the verdict below depends on.
      - name: Prove the checker can still classify drift
        run: python3 scripts/check_duck_block_vocabulary.py --self-test

      - name: Compare the vendored header against upstream's latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/check_duck_block_vocabulary.py --strict
          rc=$?
          set -e
          echo "check_duck_block_vocabulary.py --strict exit=$rc"
          exit $rc

  # EVERY READER'S OUTPUT AGAINST duck_block's CONFORMANCE MACROS.
  #
  # Before this script existed, panduck's suite checked panduck's own behaviour and
  # NOTHING about duck_block conformance: every conformance claim about this repo came
  # from a human loading duck_block_utils by hand, once, interactively. Nothing ran in
  # CI, so nothing would notice a regression -- and until this job the script itself ran
  # nowhere but a developer's terminal.
  #
  # THE MACROS ARE READ FROM UPSTREAM, NOT COPIED HERE, and that is deliberate: upstream
  # already compares them against its own extension, so a copy in this tree would be a
  # third party to a two-party agreement, checked by nobody. They are pure SQL, which is
  # what makes them usable at all -- panduck's duckdb submodule tracks the BRANCH
  # v1.5-variegata, and one `git submodule update --remote` moves it off-release and makes
  # the real validator unloadable by INSTALL, by LOAD, by any route. The SQL survives that.
  # They also carry two checks the real per-element macro cannot express: duplicate
  # element_order, and level jumping by more than one.
  #
  # PINNED TO THE LATEST RELEASE TAG, resolved and PRINTED here rather than tracking main.
  # Same reasoning as the vocabulary job: the contract with upstream is release-based, and
  # a job that diffs against a moving branch cannot attribute its own failure. Measured
  # before wiring: the tag resolves to v3.5.0 and its macro file is byte-identical to the
  # sibling working tree the local run used, so the local exit 0 is a verdict about the
  # RELEASE and not about one developer's uncommitted branch.
  #
  # THE SELF-TEST IS NOT OPTIONAL and the script runs it unprompted: it feeds itself five
  # constructed defective documents and FAILS if any is not caught, plus one conforming
  # control and FAILS if it is rejected. This repo has twice shipped a guard pointed at an
  # input that could not exercise it; a green run here means the check fired correctly on
  # known-bad input before it ever looked at a fixture.
  #
  # NO REBUILD (~40 min): like roundtrip-validation this downloads the matrix's artifact.
  # The script resolves build/release/duckdb and build/release/extension/... by DEFAULT and
  # takes no path flags, so the stock CLI and the artifact are STAGED at those two paths
  # rather than the script being changed to accept them. It issues `LOAD '<ext>'` with
  # -unsigned, so a stock CLI of the same version is sufficient -- verified locally against
  # the v1.5.6 CLI, not inferred from the dev binary, which has panduck linked in.
  #
  # WHAT IT CANNOT SEE: conformance of SHAPE and VOCABULARY on the fixtures that exist. It
  # says nothing about a format with no fixture, and nothing about whether the blocks mean
  # what the source said -- check_word_loss.py is the audit for that.
  duck-block-conformance:
    name: Every reader's output is duck_block conformant
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Unzip into its own directory: the archive contains a file named `duckdb` and the
      # checkout already has a `duckdb/` SUBMODULE directory, so extracting in place makes
      # unzip prompt to overwrite it, which on a runner reads EOF and exits 1.
      - name: Install DuckDB CLI v1.5.6
        run: |
          curl -sSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q -o duckdb.zip -d duckdb-cli
          chmod +x duckdb-cli/duckdb
          test -x duckdb-cli/duckdb || { echo "duckdb CLI not where expected"; exit 1; }
          ./duckdb-cli/duckdb --version

      - name: Download the panduck extension built above
        uses: actions/download-artifact@v4
        with:
          name: panduck-v1.5.6-extension-linux_amd64
          path: ext

      # The script's defaults, satisfied by staging rather than by new flags. Both copies
      # are asserted present afterwards: a silent cp failure here would otherwise reach the
      # script as a missing prerequisite, which --strict reports as a FAIL about the build
      # instead of about this step.
      - name: Stage the CLI and artifact where the script expects them
        run: |
          EXT=$(find ext -name 'panduck.duckdb_extension' | head -1)
          test -n "$EXT" || { echo "no panduck.duckdb_extension in the downloaded artifact"; exit 1; }
          echo "extension: $EXT"
          mkdir -p build/release/extension/panduck
          cp duckdb-cli/duckdb build/release/duckdb
          cp "$EXT" build/release/extension/panduck/panduck.duckdb_extension
          test -x build/release/duckdb || { echo "staging the CLI failed"; exit 1; }
          test -s build/release/extension/panduck/panduck.duckdb_extension \
            || { echo "staging the extension failed"; exit 1; }

      # Resolved, not pinned by hand, then PRINTED: a cited version is a timestamp, and a
      # tag written into this file would expire silently. Failing when the tag cannot be
      # resolved is the point -- an unresolvable tag must not fall back to main.
      - name: Fetch the conformance macros at upstream's latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TAG=$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/teaguesterling/duckdb_duck_block_utils/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          rc=$?
          set -e
          test "$rc" -eq 0 -a -n "$TAG" \
            || { echo "could not resolve duck_block_utils' latest release tag"; exit 1; }
          echo "duck_block_utils release: $TAG"
          git clone --quiet --depth 1 --branch "$TAG" \
            https://github.com/teaguesterling/duckdb_duck_block_utils.git upstream-dbu
          test -f upstream-dbu/vendor/duck_block_conformance.sql \
            || { echo "no vendor/duck_block_conformance.sql at $TAG"; exit 1; }

      # --strict IS LOAD-BEARING. Without it a missing macro file, a missing CLI or a
      # missing extension prints a SKIP and returns 0, so this job would go green forever
      # having validated nothing -- which is how this very script once returned SKIP with
      # exit 0 while every fixture errored.
      - name: Are all readers' blocks duck_block conformant?
        run: |
          set +e
          python3 scripts/check_duck_block_conformance.py --strict --upstream upstream-dbu
          rc=$?
          set -e
          echo "check_duck_block_conformance.py --strict exit=$rc"
          exit $rc

  # THE WRITE DIRECTION: every fixture's blocks must come back out as pandoc JSON that a
  # REAL pandoc accepts.
  #
  # panduck's readers are deliberately MORE faithful than pandoc in places -- richer
  # attributes, better block types, metadata pandoc does not extract at all -- and this is
  # the check that keeps "more faithful" from becoming "incompatible". The standing rule it
  # enforces is: diverge from pandoc's representation wherever the source justifies it,
  # discard nothing, but whatever is emitted MUST map back to VALID pandoc JSON. Valid, not
  # identical: losing an attribute pandoc has no field for is fine; emitting a shape pandoc
  # cannot parse is not.
  #
  # WHY A REAL PANDOC AND NOT A SCHEMA. The first defect of this class was a Table whose `c`
  # field held duck_block's own {"headers":...,"rows":...} projection where pandoc's grammar
  # demands a six-element array. It is well-formed JSON, it round-trips through DuckDB
  # perfectly, every in-process assertion about it passes, and pandoc rejects the whole
  # document with "expected Array but got Object". Nothing short of the real parser sees it,
  # and it went unnoticed for the entire life of the converter because nothing wrote blocks
  # back out until the write direction was registered -- and then went unnoticed again,
  # because the script that catches it ran nowhere but a terminal.
  #
  # The script self-tests unprompted: it proves pandoc REJECTS a known-bad AST and ACCEPTS a
  # conforming one before it trusts any fixture verdict.
  #
  # Staged, not rebuilt, for the same reasons as duck-block-conformance above: the script
  # hardcodes build/release/duckdb and build/release/extension/..., issues `LOAD` with
  # -unsigned, and needs no flags added to work against the matrix's artifact.
  #
  # --require IS LOAD-BEARING: without it a missing pandoc, CLI or extension prints a SKIP
  # and returns 0, reporting coverage this job is not providing.
  #
  # WHAT IT CANNOT SEE: that the pandoc JSON means the same thing as the source. It proves
  # the mapping is TOTAL -- that pandoc accepts everything panduck emits -- not that it is
  # faithful.
  pandoc-writeback:
    name: Blocks write back as pandoc-valid JSON
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version | head -1

      - name: Install DuckDB CLI v1.5.6
        run: |
          curl -sSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q -o duckdb.zip -d duckdb-cli
          chmod +x duckdb-cli/duckdb
          test -x duckdb-cli/duckdb || { echo "duckdb CLI not where expected"; exit 1; }
          ./duckdb-cli/duckdb --version

      - name: Download the panduck extension built above
        uses: actions/download-artifact@v4
        with:
          name: panduck-v1.5.6-extension-linux_amd64
          path: ext

      - name: Stage the CLI and artifact where the script expects them
        run: |
          EXT=$(find ext -name 'panduck.duckdb_extension' | head -1)
          test -n "$EXT" || { echo "no panduck.duckdb_extension in the downloaded artifact"; exit 1; }
          echo "extension: $EXT"
          mkdir -p build/release/extension/panduck
          cp duckdb-cli/duckdb build/release/duckdb
          cp "$EXT" build/release/extension/panduck/panduck.duckdb_extension
          test -x build/release/duckdb || { echo "staging the CLI failed"; exit 1; }
          test -s build/release/extension/panduck/panduck.duckdb_extension \
            || { echo "staging the extension failed"; exit 1; }

      - name: Does a real pandoc accept everything panduck writes?
        run: |
          set +e
          python3 scripts/check_pandoc_writeback.py --require
          rc=$?
          set -e
          echo "check_pandoc_writeback.py --require exit=$rc"
          exit $rc

  # panduck's COPY OF THE CONVERTER vs duck_block_utils' COPY.
  #
  # src/pandoc_block_convert.cpp lives in BOTH repos: panduck's is the moved copy and
  # upstream keeps theirs until the handoff's step 4 deletes it. Each repo tests its own
  # copy against its own expectations and each passes, which is NOT the same as the copies
  # agreeing -- and the difference is where defects live. A hand-run version of this check
  # found one: coverage of handled pandoc constructors was identical on both sides, but
  # CheckPandocDepth appeared 8 times upstream and 7 here. That one number was a recursion
  # bound panduck had lost, where ExtractInlinesTextVal segfaulted on a nested AST at depth
  # 50,000 and upstream raised a clean error at 128. A Pandoc AST is document-controlled
  # input, so that was a crash reachable from a file. Neither suite could have found it:
  # the defect existed only in the RELATIONSHIP.
  #
  # NON-BLOCKING, AND THAT IS THE DESIGN RATHER THAN A CONCESSION. Two reasons, both from
  # the script's own account of itself:
  #
  #   It compares against upstream's main, resolved to a sha per run (every other
  #   upstream-facing gate here is release-based). A merge on a DIFFERENT repo's branch can
  #   therefore change this verdict with no commit in panduck, and a gate that reds main for
  #   a change no one here made cannot be acted on by the person who sees it.
  #
  #   It reports A SIGNAL TO INVESTIGATE, NOT A DIAGNOSIS -- three coarse invariants
  #   (handled constructors, guard calls, defined functions). What identified the recursion
  #   bound was a human reading the diff hunks; the counts only said where to look. Blocking
  #   a merge on a signal that does not establish a defect is a category error, and treating
  #   a green run as "the copies behave identically" is the same mistake inverted.
  #
  # So: advisory via continue-on-error, loud in the log, and the exit code is still captured
  # and printed so a failure is never inferred from grepped output. Measured before wiring
  # (2026-10-08): exit 0, no divergence, upstream main at e00db69840 -- which is currently
  # the v3.5.0 release commit.
  #
  # IT EXPIRES. The window opened when there were two copies and closes when step 4 deletes
  # upstream's; at that point delete this job rather than fixing it. It does not become
  # blocking -- a release-based comparison is impossible once the second copy is gone.
  #
  # WHAT IT CANNOT SEE: a producer/consumer attribute mismatch, which is a disagreement
  # between two DIFFERENT files in ONE repo and structurally out of scope. The obvious
  # widening -- attributes written anywhere vs read anywhere -- was prototyped and failed in
  # both directions (silent on the real defect, loud on correct layering), so it is recorded
  # as measured-and-rejected rather than left as an improvement someone reimplements.
  converter-divergence:
    name: Converter copies agree with upstream (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # The script self-tests unprompted and fails if its own comparators cannot detect a
      # planted divergence, so a green run cannot mean "found nothing because it compared
      # nothing".
      - name: Compare panduck's converter against upstream's copy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/check_converter_divergence.py --require
          rc=$?
          set -e
          echo "check_converter_divergence.py --require exit=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Converter divergence::A SIGNAL TO INVESTIGATE, not a diagnosis: read the hunks before concluding anything. Advisory -- this does not block the merge."
          fi
          exit $rc
